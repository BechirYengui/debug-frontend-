<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{t:signup.meta.title}}</title>
<link rel="stylesheet" href="/static/dojo.css">
<link rel="stylesheet" href="/static/site.css">
</head>
<body class="auth">
{{NAV}}

<main class="auth-main">
  <section class="auth-card" aria-labelledby="auth-title">
    <span class="kicker">{{t:signup.kicker}}</span>
    <h1 class="auth-title" id="auth-title">{{t:signup.title}}</h1>
    <p class="auth-sub">{{t:signup.subtitle}}</p>

    {{ERROR}}

    <form class="auth-form" method="post" action="/signup">
      <input type="hidden" name="next" value="{{NEXT}}">
      <div class="field">
        <label for="signup-username">{{t:signup.username}}</label>
        <input type="text" id="signup-username" name="username" value="{{USERNAME}}" placeholder="{{t:signup.username_ph}}"
               autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="32" autofocus
               aria-describedby="signup-username-hint">
        <small class="auth-hint" id="signup-username-hint">{{t:signup.username_hint}}</small>
      </div>
      <div class="field">
        <label for="signup-password">{{t:signup.password}}</label>
        <input type="password" id="signup-password" name="password" autocomplete="new-password" required minlength="8"
               aria-describedby="signup-password-hint">
        <small class="auth-hint" id="signup-password-hint">{{t:signup.password_hint}}</small>
      </div>
      <div class="field">
        <label for="signup-password2">{{t:signup.password2}}</label>
        <input type="password" id="signup-password2" name="password2" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field">
        <label for="signup-lang">{{t:signup.lang}}</label>
        <select id="signup-lang" name="lang">
          <option value="fr" {{LANG_FR_SELECTED}}>{{t:signup.lang_fr}}</option>
          <option value="en" {{LANG_EN_SELECTED}}>{{t:signup.lang_en}}</option>
        </select>
      </div>
      <button class="btn btn-primary auth-submit" type="submit">{{t:signup.submit}}</button>
    </form>

    <p class="auth-note">{{t:signup.note}}</p>
    <p class="auth-switch">{{t:signup.have_account}}<a href="/login">{{t:signup.login_link}}</a></p>
  </section>

  <a class="auth-back" href="/">{{t:signup.back}}</a>
</main>

</body>
</html>
