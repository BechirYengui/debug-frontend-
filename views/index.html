<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{t:dash.title}}</title>
<link rel="stylesheet" href="/static/dojo.css">
<script>window.DOJO_HOME = { lang: "{{LANG}}" };</script>
</head>
<body class="home">
{{NAV}}

<div class="page">

<header class="board-head">
  <div>
    <span class="kicker">{{t:dash.kicker}}</span>
    <h1>{{t:dash.h1}}</h1>
    <p class="lead">{{t:dash.lead}}</p>
  </div>
  <a class="next-cta" href="/challenge/{{NEXT_ID}}">{{t:dash.next}} <b>{{NEXT_ID}} : {{NEXT_TITLE}}</b></a>
</header>

<main id="families">
  <div class="filters" id="filters" role="group"><button class="filter is-on" type="button" data-filter="all" aria-pressed="true">{{t:dash.filter.all}}</button><button class="filter" type="button" data-filter="todo" aria-pressed="false">{{t:dash.filter.todo}}</button><button class="filter" type="button" data-filter="done" aria-pressed="false">{{t:dash.filter.done}}</button><button class="filter" type="button" data-filter="s1" aria-pressed="false" title="{{t:card.difficulty}}">★☆☆</button><button class="filter" type="button" data-filter="s2" aria-pressed="false" title="{{t:card.difficulty}}">★★☆</button><button class="filter" type="button" data-filter="s3" aria-pressed="false" title="{{t:card.difficulty}}">★★★</button></div>

{{FAMILIES}}
</main>

<footer class="home-foot">
  <span class="small">{{FOOT}}</span>
</footer>

</div>

<script src="/static/home.js" defer></script>
</body>
</html>
